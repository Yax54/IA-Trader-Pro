# Gradle JVM - augmenté pour éviter les OOM lors du build Kotlin/AGP
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=false
org.gradle.workers.max=2
org.gradle.jvmargs=-Xms512m -Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseG1GC
kotlin.incremental=true
kotlin.compiler.execution.strategy=daemon
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Clé API Alpha Vantage — remplacez par votre vraie clé sur https://www.alphavantage.co/support/#api-key
ALPHA_VANTAGE_API_KEY=YOUR_API_KEY_HERE
